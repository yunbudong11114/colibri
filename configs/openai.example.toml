[model]
# 模型提供方；真实模型使用 openai_compatible。
provider = "openai_compatible"
# OpenAI-compatible API 基础地址。
base_url = "https://api.openai.com/v1"
# 模型名称。
model = "gpt-5.5"
# 模型 API Key；为空时默认读取 COLIBRI_API_KEY 环境变量。
api_key = ""
# 单次模型请求超时时间，单位秒。
timeout_seconds = 60
# 临时网络、超时、限流和 5xx 错误的最大重试次数。
max_retries = 2
# 首次重试退避毫秒数；后续按 2 倍增长。
retry_backoff_ms = 500
# 单次模型回复的最大输出 token 数。
max_output_tokens = 16384
# 上下文容量自动识别。自定义部署可选填 input_context_tokens 覆盖。

[vision]
# 视觉模型名称；为空时复用 [model].model。
model = ""
# 视觉模型 API 地址；为空时复用 [model].base_url。
base_url = ""
# 视觉模型 API Key；为空时复用 [model].api_key 或 COLIBRI_API_KEY。
api_key = ""
# 视觉模型请求超时时间，单位秒。
timeout_seconds = 60
# 单张图片发送给模型的最大字节数。
max_image_bytes = 4194304

[session]
# 可选上下文内存预算，单位 MiB；省略或 0 不额外限制。
# max_context_memory_mib = 10
# 单次用户请求内允许的最大工具调用轮数。
# REPL 空闲自动退出是否启用。
idle_exit_enabled = false
# REPL 空闲自动退出等待秒数。
idle_exit_seconds = 300
# 新建 session 首次对话前是否从共享 transcript 恢复近期完整问答。
restore_transcript = true
# transcript 文件保留天数；设为 0 时不按时间清理。
transcript_retention_days = 30
# transcript 目录允许占用的总字节数；设为 0 时不按容量清理。
transcript_max_total_bytes = 134217728

[tools]
# 单次工具结果写入上下文前的最大字符数。
max_result_chars = 32000

[hardware]
# 是否允许向模型暴露硬件工具；默认关闭。
enabled = false
# 当前仅支持按需探测，不启动后台设备监听。
discovery = "on_demand"
# 单次硬件操作超时，单位秒。
operation_timeout_seconds = 2.0
# 单次串口请求、响应或原始传输的最大字节数。
max_transfer_bytes = 4096

# 设备表本身就是硬件路径白名单。取消注释并按真机设备节点调整。
# [[hardware.devices]]
# name = "controller"
# path = "/dev/ttyACM0"
# transport = "serial_json"
# baud_rate = 115200
# capabilities = ["serial", "gpio", "i2c", "spi"]
# allow_write = false
